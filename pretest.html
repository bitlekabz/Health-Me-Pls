<main class="test-page">

    <p class="test-page__eyebrow">ก่อนเริ่มเรียน</p>
    <h1 class="test-page__title">แบบทดสอบก่อนเรียน</h1>
    <p class="test-page__lead">ทำแบบทดสอบสั้นๆ นี้ก่อนเริ่มอ่านบทเรียน เพื่อเช็กว่าตอนนี้รู้อะไรอยู่แล้วบ้าง จะได้รู้ว่าควรให้เวลากับบทไหนเป็นพิเศษ</p>

    <form class="quiz" id="quizForm">

        <div class="quiz-question" data-correct="c" data-lesson="1" data-prompt="&ldquo;ธงโภชนาการ&rdquo; แนะนำให้กินอาหารหมวดใดมากที่สุดเป็นฐานล่างสุด?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q1" value="a"> เนื้อสัตว์และนม</label>
                <label class="quiz-option"><input type="radio" name="q1" value="b"> ผักและผลไม้</label>
                <label class="quiz-option"><input type="radio" name="q1" value="c"> ข้าวและแป้ง</label>
                <label class="quiz-option"><input type="radio" name="q1" value="d"> น้ำตาลและไขมัน</label>
            </div>
        </div>

        <div class="quiz-question" data-correct="b" data-lesson="1" data-prompt="วิธีแบ่งจานอาหารที่แนะนำในบทเรียนคือข้อใด?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q2" value="a"> ข้าวครึ่งจาน ผักหนึ่งในสี่ โปรตีนหนึ่งในสี่</label>
                <label class="quiz-option"><input type="radio" name="q2" value="b"> ผักครึ่งจาน ข้าว/แป้งหนึ่งในสี่ โปรตีนหนึ่งในสี่</label>
                <label class="quiz-option"><input type="radio" name="q2" value="c"> โปรตีนครึ่งจาน ผักหนึ่งในสี่ ข้าวหนึ่งในสี่</label>
                <label class="quiz-option"><input type="radio" name="q2" value="d"> แบ่งเท่าๆ กันทั้งสามหมวดอย่างละหนึ่งในสาม</label>
            </div>
        </div>

        <div class="quiz-question" data-correct="c" data-lesson="2" data-prompt="หลักการที่เหมาะสมสำหรับผู้เริ่มต้นออกกำลังกายคือข้อใด?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q3" value="a"> ออกให้หนักที่สุดตั้งแต่วันแรกเพื่อเห็นผลเร็ว</label>
                <label class="quiz-option"><input type="radio" name="q3" value="b"> ออกกำลังกายเฉพาะวันหยุดเท่านั้น</label>
                <label class="quiz-option"><input type="radio" name="q3" value="c"> เริ่มจากความหนักที่เหมาะสมแล้วค่อยๆ เพิ่มทีละน้อย</label>
                <label class="quiz-option"><input type="radio" name="q3" value="d"> เลือกออกกำลังกายแบบเดียวไปตลอดโดยไม่ปรับเปลี่ยน</label>
            </div>
        </div>

        <div class="quiz-question" data-correct="a" data-lesson="2" data-prompt="&ldquo;กิจกรรมทางกาย&rdquo; ต่างจาก &ldquo;การออกกำลังกาย&rdquo; อย่างไร?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q4" value="a"> กิจกรรมทางกายคือการเคลื่อนไหวทั่วไปที่ใช้พลังงาน ไม่จำเป็นต้องมีแบบแผน</label>
                <label class="quiz-option"><input type="radio" name="q4" value="b"> กิจกรรมทางกายต้องทำในฟิตเนสเท่านั้น</label>
                <label class="quiz-option"><input type="radio" name="q4" value="c"> ทั้งสองคำมีความหมายเหมือนกันทุกประการ</label>
                <label class="quiz-option"><input type="radio" name="q4" value="d"> การออกกำลังกายไม่นับเป็นกิจกรรมทางกาย</label>
            </div>
        </div>

        <div class="quiz-question" data-correct="d" data-lesson="3" data-prompt="การนอนหลับที่มีคุณภาพควรพิจารณาจากอะไร นอกเหนือจากจำนวนชั่วโมง?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q5" value="a"> เวลาที่ใช้เล่นโทรศัพท์ก่อนนอน</label>
                <label class="quiz-option"><input type="radio" name="q5" value="b"> ขนาดของหมอนที่ใช้</label>
                <label class="quiz-option"><input type="radio" name="q5" value="c"> อุณหภูมิห้องนอนเพียงอย่างเดียว</label>
                <label class="quiz-option"><input type="radio" name="q5" value="d"> การหลับได้ต่อเนื่องและตื่นกลางดึกบ่อยหรือไม่</label>
            </div>
        </div>

        <div class="quiz-question" data-correct="b" data-lesson="3" data-prompt="การนอนหลับไม่เพียงพอส่งผลต่อสิ่งใดบ้าง?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q6" value="a"> ไม่มีผลใดๆ ต่อร่างกายหากนอนชดเชยวันหลัง</label>
                <label class="quiz-option"><input type="radio" name="q6" value="b"> สมาธิ อารมณ์ และความสามารถในการเรียนรู้</label>
                <label class="quiz-option"><input type="radio" name="q6" value="c"> ส่งผลเฉพาะรูปร่างภายนอกเท่านั้น</label>
                <label class="quiz-option"><input type="radio" name="q6" value="d"> ทำให้ความจำดีขึ้นในระยะสั้น</label>
            </div>
        </div>

        <div class="quiz-question" data-correct="c" data-lesson="4" data-prompt="ความเครียดแบบเฉียบพลันมีลักษณะอย่างไร?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q7" value="a"> เกิดขึ้นตลอดเวลาโดยไม่มีสาเหตุ</label>
                <label class="quiz-option"><input type="radio" name="q7" value="b"> สะสมจากหลายเรื่องต่อเนื่องกันเป็นเวลานาน</label>
                <label class="quiz-option"><input type="radio" name="q7" value="c"> เกิดจากเหตุการณ์ใดเหตุการณ์หนึ่งและมักลดลงเมื่อสถานการณ์ผ่านไป</label>
                <label class="quiz-option"><input type="radio" name="q7" value="d"> เป็นอาการที่พบเฉพาะในผู้ใหญ่เท่านั้น</label>
            </div>
        </div>

        <div class="quiz-question" data-correct="a" data-lesson="4" data-prompt="ข้อใดเป็นวิธีรับมือความเครียดที่บทเรียนแนะนำ?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q8" value="a"> หายใจช้าๆ ออกกำลังกาย และพูดคุยกับคนที่ไว้ใจ</label>
                <label class="quiz-option"><input type="radio" name="q8" value="b"> ดื่มแอลกอฮอล์เพื่อให้รู้สึกดีขึ้นชั่วคราว</label>
                <label class="quiz-option"><input type="radio" name="q8" value="c"> เก็บความรู้สึกไว้คนเดียวโดยไม่บอกใคร</label>
                <label class="quiz-option"><input type="radio" name="q8" value="d"> พยายามคิดแก้ทุกปัญหาพร้อมกันในคราวเดียว</label>
            </div>
        </div>

        <div class="quiz-question" data-correct="b" data-lesson="5" data-prompt="&ldquo;สุขภาพจิตที่ดี&rdquo; ตามบทเรียนหมายถึงอะไร?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q9" value="a"> การไม่รู้สึกเศร้าหรือเครียดเลย</label>
                <label class="quiz-option"><input type="radio" name="q9" value="b"> ความสามารถในการรับรู้และจัดการกับอารมณ์ของตัวเองได้อย่างเหมาะสม</label>
                <label class="quiz-option"><input type="radio" name="q9" value="c"> การมีความสุขตลอดเวลาโดยไม่มีข้อยกเว้น</label>
                <label class="quiz-option"><input type="radio" name="q9" value="d"> การไม่แสดงอารมณ์ใดๆ ออกมาให้คนอื่นเห็น</label>
            </div>
        </div>

        <div class="quiz-question" data-correct="d" data-lesson="5" data-prompt="ข้อใดถูกต้องเกี่ยวกับความเศร้ากับภาวะซึมเศร้า?">
            <p class="quiz-question__prompt"></p>
            <div class="quiz-options">
                <label class="quiz-option"><input type="radio" name="q10" value="a"> เป็นสิ่งเดียวกันทุกประการ ใช้แทนกันได้เสมอ</label>
                <label class="quiz-option"><input type="radio" name="q10" value="b"> ภาวะซึมเศร้าเป็นแค่ความเศร้าที่รุนแรงขึ้นเล็กน้อยเท่านั้น</label>
                <label class="quiz-option"><input type="radio" name="q10" value="c"> ความเศร้าต้องได้รับการวินิจฉัยจากแพทย์เสมอ</label>
                <label class="quiz-option"><input type="radio" name="q10" value="d"> ภาวะซึมเศร้าเป็นปัญหาสุขภาพจิตที่ต้องได้รับการประเมิน ไม่ควรสรุปจากอาการเศร้าเพียงอย่างเดียว</label>
            </div>
        </div>

        <button class="quiz-submit" type="button" id="quizSubmitBtn">ส่งคำตอบ</button>
    </form>

    <div class="quiz-result">
        <p class="quiz-result__label" id="quizResultLabel">ผลคะแนนจะแสดงที่นี่</p>
        <p class="quiz-result__detail" id="quizResultDetail"></p>
    </div>

</main>

<script src="script.js"></script>
<script src="auth.js"></script>
<script>
    (function () {
        const LESSON_TITLES = {
            1: "บทที่ 01 — โภชนาการพื้นฐาน: กินอย่างไรให้สมดุล",
            2: "บทที่ 02 — เริ่มออกกำลังกายแบบไม่ฝืนตัวเอง",
            3: "บทที่ 03 — นอนหลับให้มีคุณภาพ ไม่ใช่แค่ให้ครบชั่วโมง",
            4: "บทที่ 04 — จัดการความเครียดในชีวิตประจำวัน",
            5: "บทที่ 05 — ดูแลสุขภาพจิตและอารมณ์"
        };

        const form = document.getElementById("quizForm");
        const btn = document.getElementById("quizSubmitBtn");
        const resultLabel = document.getElementById("quizResultLabel");
        const resultDetail = document.getElementById("quizResultDetail");

        if (!form || !btn) return;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuestions() {
            const questions = Array.from(form.querySelectorAll(".quiz-question"));
            shuffle(questions);

            questions.forEach((q, index) => {
                form.insertBefore(q, btn);
                const promptEl = q.querySelector(".quiz-question__prompt");
                promptEl.innerHTML = `${index + 1}. ${q.dataset.prompt}`;
            });
        }

        renderQuestions();

        btn.addEventListener("click", () => {
            const questions = form.querySelectorAll(".quiz-question");
            let answered = 0;
            let correct = 0;
            const reviewLessons = new Set();

            questions.forEach((q) => {
                const name = q.querySelector("input[type=radio]").name;
                const selected = form.querySelector(`input[name="${name}"]:checked`);
                const correctValue = q.dataset.correct;

                q.classList.remove("is-correct", "is-incorrect");

                if (selected) {
                    answered++;
                    if (selected.value === correctValue) {
                        correct++;
                        q.classList.add("is-correct");
                    } else {
                        q.classList.add("is-incorrect");
                        reviewLessons.add(Number(q.dataset.lesson));
                    }
                }
            });

            if (answered < questions.length) {
                resultLabel.textContent = `กรุณาตอบให้ครบทุกข้อ (ตอบแล้ว ${answered}/${questions.length} ข้อ)`;
                resultDetail.textContent = "";
                return;
            }

            resultLabel.textContent = `คุณได้คะแนน ${correct} จาก ${questions.length} ข้อ`;

            if (reviewLessons.size === 0) {
                resultDetail.textContent = "ทำได้ครบถ้วนทุกข้อ ไม่มีบทที่ต้องทบทวนเพิ่มเติม";
            } else {
                const sortedTitles = Array.from(reviewLessons)
                    .sort((a, b) => a - b)
                    .map((n) => LESSON_TITLES[n]);
                resultDetail.textContent = `ควรทบทวนเพิ่มเติมในบทต่อไปนี้: ${sortedTitles.join(" / ")}`;
            }
        });
    })();
</script>
