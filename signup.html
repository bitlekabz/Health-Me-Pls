<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก — Health Me Pls</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="lesson-page-body">

<nav class="site-nav">
    <div class="site-nav__left">
        <a class="site-nav__brand" href="index.html">Health Me Please</a>
        <a class="site-nav__back" href="index.html">&larr; กลับหน้าแรก</a>
    </div>
    <div class="site-nav__actions">
        <a class="site-nav__link site-nav__link--login" href="login.html">เข้าสู่ระบบ</a>
        <a class="site-nav__link site-nav__link--signup" href="signup.html">สมัคร</a>
    </div>
</nav>

<main class="auth-page">
    <div class="auth-card">
        <h1 class="auth-card__title">สมัครสมาชิก</h1>
        <p class="auth-card__lead">สมัครด้วยบัญชี Gmail ของคุณ</p>

        <div class="auth-google-wrap">
            <div id="googleSignupBtn" class="auth-google-btn"></div>
            <p id="googleUnavailableMsg" class="auth-field small" style="display:none; margin-top:1rem; color:#C0392B; font-family:'Kanit',sans-serif; font-size:.85rem;">
                ระบบสมัครสมาชิกด้วย Google ยังไม่พร้อมใช้งานในขณะนี้ กรุณาลองใหม่อีกครั้งภายหลัง
            </p>
        </div>

        <p class="auth-switch">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </div>
</main>

<script src="auth.js"></script>

</body>
</html>
